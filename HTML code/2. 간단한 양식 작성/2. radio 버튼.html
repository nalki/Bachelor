<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio 버튼</title>
</head>
<body>
    <form>
        <!--여러개 중에 하나만 선택 가능-->
        <p>car</p>
        <input type="radio" id="hyundai" name="cars" value="hyundai">
        <label for="hyundai">hyundai</label>
        <br>

        <label for="ford">ford</label>
        <input type="radio" id="ford" name="cars" value="ford">
        <br>

        <label for="toyota">toyota</label>
        <input type="radio" id="toyota" name="cars" value="toyota">
        <br>

        <input type="submit" value="submit">
    </form>
</body>
</html>
